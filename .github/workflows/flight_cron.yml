name: 24/7 Jakarta Flight Automated Logger

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-flight-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas pytz; fi

      - name: Run Jakarta Flight Tracker Logger Script
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        run: |
          python flight_logger.py

      - name: Commit and Push Flight Dataset Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add jakarta_flights_log.csv
          git commit -m "Auto-update Jakarta flight logs [skip ci]" || exit 0
          git pull --rebase
          git push
