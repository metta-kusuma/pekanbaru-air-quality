name: Run One-Time Flight Dataset Fixer

on:
  workflow_dispatch:

concurrency:
  group: global-repo-git-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-fixer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Execute Cleaning Script
        run: |
          python clean_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add jakarta_flights_log_opensky.csv
          git commit -m "Directly update/fix old 'Other Airline' labels in OpenSky CSV [skip ci]" || exit 0
          git pull --rebase origin main
          git push
