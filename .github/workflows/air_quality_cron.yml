name: 24/7 Pekanbaru Weather & AQI Automated Logger

on:
  schedule:
    # Berjalan di menit ke-13 dan ke-43 setiap jam (sepi antrean global)
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Combined Logger Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
        run: |
          python logger.py

      - name: Commit and Push Dataset Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Auto-update weather & air quality logs [skip ci]" || exit 0
          git push
