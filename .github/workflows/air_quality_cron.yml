name: Auto Logger AQI Pekanbaru

on:
  schedule:
    # Mengatur agar skrip berjalan otomatis setiap 1 jam sekali
    - cron: '*/30 * * * *'
  workflow_dispatch: # Tombol untuk menjalankan manual kapan saja

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Logger Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python logger.py

      - name: Commit and Push Dataset Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add pekanbaru_air_quality_log.csv
          git commit -m "Auto-update air quality dataset log" || exit 0
          git push
