name: 24/7 Jakarta & Singapore Flight Logger (OpenSky & FR24)

on:
  workflow_dispatch: # Tetap bisa dijalankan manual via tombol UI GitHub

concurrency:
  group: global-repo-git-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-flight-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas pytz FlightRadarAPI; fi

      - name: Run Multi-Region Flight Tracker Logger Script
        env:
          OPENSKY_USERNAME: ${{ secrets.OPENSKY_USERNAME }}
          OPENSKY_PASSWORD: ${{ secrets.OPENSKY_PASSWORD }}
        run: |
          python flight_logger_opensky.py

      - name: Commit and Push Flight Dataset Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add *.csv
          git commit -m "Auto-update Jakarta & Singapore flight logs (OpenSky & FR24) [skip ci]" || exit 0
          git pull --rebase
          git push
